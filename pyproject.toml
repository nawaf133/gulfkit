[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gulfkit"
version = "0.1.0"
description = "أداة سطر أوامر عربية لمطوري السعودية والخليج"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "Nawaf Omar" }]
keywords = ["arabic", "saudi", "gulf", "cli", "hijri", "iban", "zatca"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Natural Language :: Arabic",
]

[project.urls]
Homepage = "https://github.com/nawaf133/gulfkit"

[project.scripts]
gulfkit = "gulfkit.cli:main"

[tool.setuptools]
packages = ["gulfkit"]
